<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Séances</title>
<meta name="description" content="Suivi de progression des films et séries.">
<meta name="theme-color" content="#16202E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Séances">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#E3E8EF; --ink:#16202E; --muted:#5B6778; --line:#D3DAE3;
  --accent:#B3243B; --accent-ink:#FFFFFF;
  --encours:#B86E0A; --encours-bg:#FBEBD2;
  --avoir:#3D5A99; --avoir-bg:#DDE5F6;
  --fini:#1F7A6B; --fini-bg:#D5EEE8;
  --track:#DCE2EA;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0F141B; --surface:#18202B; --surface-2:#222C39; --ink:#E8EDF4; --muted:#96A2B3; --line:#2B3645;
    --accent:#E0566C; --accent-ink:#1A0A0E;
    --encours:#F0A93F; --encours-bg:#3A2A12;
    --avoir:#8FA9E6; --avoir-bg:#1F2A44;
    --fini:#5CC7B2; --fini-bg:#133530;
    --track:#2B3645;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-stretch:68%;font-weight:800;font-size:clamp(34px,9vw,48px);line-height:.95;letter-spacing:-.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.top-right{display:flex;align-items:flex-end;gap:12px}
.stats{display:flex;gap:14px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.stats b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer;display:grid;place-items:center}

.controls{display:grid;gap:10px;margin-top:20px}
.seg{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;white-space:nowrap;border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:8px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg .dot{display:inline-block;min-width:16px;height:16px;padding:0 4px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:10px;line-height:16px;margin-left:4px;vertical-align:1px}
.row{display:flex;gap:8px}
input[type=search],.field input,.field select{width:100%;font:500 16px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip-f{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--body);padding:0 12px;border-radius:10px;cursor:pointer;white-space:nowrap}
.chip-f[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}

.list{display:grid;gap:10px;margin-top:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.card.demo{opacity:.72;border-style:dashed}
.c-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.poster{width:48px;aspect-ratio:2/3;border-radius:6px;object-fit:cover;background:var(--surface-2);display:block}
.poster.ph{display:grid;place-items:center;font-family:var(--display);font-weight:800;color:var(--muted);font-size:18px}
.c-title{font-family:var(--display);font-stretch:85%;font-weight:700;font-size:19px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
.pill{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:99px;white-space:nowrap}
.p-type{background:var(--surface-2);color:var(--muted)}
.p-a_voir{background:var(--avoir-bg);color:var(--avoir)}
.p-en_cours{background:var(--encours-bg);color:var(--encours)}
.p-termine{background:var(--fini-bg);color:var(--fini)}
.p-demo{border:1px dashed var(--muted);color:var(--muted)}
.s-dispo{background:var(--accent);color:var(--accent-ink)}
.s-annoncee{background:var(--encours-bg);color:var(--encours)}
.s-fin{background:var(--surface-2);color:var(--muted)}
.s-inconnu{border:1px dashed var(--muted);color:var(--muted)}
.counter{font-family:var(--mono);font-weight:700;font-size:15px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.counter small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.bar{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--encours);transition:width .25s}
.card[data-s="termine"] .bar i{background:var(--fini)}
.card[data-s="a_voir"] .bar i{background:var(--avoir)}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 12px;border-radius:9px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;color:var(--muted);background:transparent}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.stars{display:flex;gap:2px}
.stars button{border:0;background:none;font-size:22px;line-height:1;padding:4px 2px;cursor:pointer;color:var(--track)}
.stars button.on{color:var(--encours)}
.suite{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.suite select,.suite input[type=date]{font:600 13px var(--body);color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.auto{flex-basis:100%;display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:14px}
.checkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.checkbar b{color:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);z-index:5}

.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);border:0;border-radius:99px;padding:14px 20px;font:700 15px var(--body);box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}

dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 24px));max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(10,14,20,.5)}
form.sheet,.sheet{display:grid;gap:14px;padding:18px}
.sheet h2{font-family:var(--display);font-stretch:75%;font-weight:800;text-transform:uppercase;font-size:24px;margin:0}
.field{display:grid;gap:5px}
.field label{font:600 12px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sugg{display:grid;gap:4px;margin-top:4px}
.sugg-status{font-size:13px;color:var(--muted);padding:4px 2px}
.sugg button{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:8px 10px;cursor:pointer;font:500 14px var(--body)}
.sugg button img,.sugg button .ph{width:34px;aspect-ratio:2/3;border-radius:4px;object-fit:cover;background:var(--line)}
.sugg b{font-weight:700;display:block}
.sugg small{font-size:12px;color:var(--muted)}
.help{font-size:14px;color:var(--muted);margin:0}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Mes <span>Séances</span></h1>
      <p class="sub">Films et séries : où j'en suis.</p>
    </div>
    <div class="top-right">
      <div class="stats" id="stats"></div>
      <button class="icon-btn" id="menuBtn" aria-label="Sauvegarde et réglages">⋯</button>
    </div>
  </header>

  <div class="controls">
    <div class="seg" role="group" aria-label="Statut">
      <button data-f="tous" aria-pressed="true">Tout</button>
      <button data-f="en_cours" aria-pressed="false">En cours</button>
      <button data-f="a_voir" aria-pressed="false">À voir</button>
      <button data-f="termine" aria-pressed="false">Terminés</button>
      <button data-f="suites" aria-pressed="false" id="segSuites">Suites</button>
    </div>
    <div class="row">
      <input type="search" id="q" placeholder="Rechercher dans ma liste" aria-label="Rechercher">
      <button class="chip-f" data-t="film" aria-pressed="false">Films</button>
      <button class="chip-f" data-t="serie" aria-pressed="false">Séries</button>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<button class="fab" id="addBtn">+ Ajouter</button>
<div class="toast" id="toast" hidden></div>

<dialog id="dlg">
  <form class="sheet" id="form">
    <h2 id="dlgTitle">Ajouter</h2>
    <div class="field">
      <label for="f-titre">Titre</label>
      <input id="f-titre" required maxlength="120" autocomplete="off" placeholder="Tape un titre…">
      <div class="sugg" id="sugg" hidden></div>
    </div>
    <div class="grid2">
      <div class="field">
        <label for="f-type">Type</label>
        <select id="f-type"><option value="serie">Série</option><option value="film">Film</option></select>
      </div>
      <div class="field">
        <label for="f-statut">Statut</label>
        <select id="f-statut"><option value="a_voir">À voir</option><option value="en_cours">En cours</option><option value="termine">Terminé</option></select>
      </div>
    </div>
    <div class="grid2" id="serieFields">
      <div class="field"><label for="f-saison">Saison actuelle</label><input id="f-saison" type="number" min="1" inputmode="numeric" value="1"></div>
      <div class="field"><label for="f-nbs">Nb de saisons</label><input id="f-nbs" type="number" min="1" inputmode="numeric" placeholder="ex. 5"></div>
      <div class="field"><label for="f-ep">Épisodes vus (saison)</label><input id="f-ep" type="number" min="0" inputmode="numeric" value="0"></div>
      <div class="field"><label for="f-nbe">Épisodes dans la saison</label><input id="f-nbe" type="number" min="1" inputmode="numeric" value="10"></div>
    </div>
    <div class="grid2" id="suiteFields">
      <div class="field">
        <label for="f-suite">Saison suivante</label>
        <select id="f-suite">
          <option value="inconnu">Pas d'info</option>
          <option value="annoncee">Annoncée</option>
          <option value="sortie">Disponible</option>
          <option value="fin">Pas de suite (fin)</option>
          <option value="annulee">Annulée</option>
        </select>
      </div>
      <div class="field"><label for="f-suitedate">Date de sortie</label><input id="f-suitedate" type="date"></div>
    </div>
    <div class="grid2" id="filmFields" hidden>
      <div class="field"><label for="f-pos">Arrêté à (min)</label><input id="f-pos" type="number" min="0" inputmode="numeric" value="0"></div>
      <div class="field"><label for="f-duree">Durée (min)</label><input id="f-duree" type="number" min="1" inputmode="numeric" value="120"></div>
    </div>
    <div class="field">
      <label for="f-ou">Où le regarder</label>
      <input id="f-ou" maxlength="40" placeholder="Netflix, Canal+, DVD…" autocomplete="off">
    </div>
    <div class="sheet-actions">
      <div class="row">
        <button type="button" class="btn danger" id="delBtn" hidden>Supprimer</button>
        <button type="button" class="btn danger" id="delConfirm" hidden>Confirmer la suppression</button>
      </div>
      <div class="row">
        <button type="button" class="btn ghost" id="cancelBtn">Annuler</button>
        <button type="submit" class="btn primary">Enregistrer</button>
      </div>
    </div>
  </form>
</dialog>

<dialog id="menu">
  <div class="sheet">
    <h2>Sauvegarde</h2>
    <p class="help">Ta liste est gardée sur ce téléphone. Fais une copie de temps en temps pour ne rien perdre si tu changes de téléphone.</p>
    <button class="btn primary" id="exportBtn" type="button">Exporter ma liste (fichier)</button>
    <label class="btn" for="importFile" style="text-align:center">Importer une sauvegarde</label>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <p class="help" id="menuMsg"></p>
    <p class="help">Infos séries : TVmaze. Infos films : iTunes.</p>
    <button class="btn ghost" id="menuClose" type="button">Fermer</button>
  </div>
</dialog>

<script>
(function(){
  const LS_KEY = "mes-seances-v1";
  const DEMO = [
    {id:"d1",demo:true,titre:"Exemple : une série en cours",type:"serie",statut:"en_cours",saison:2,nbSaisons:4,ep:5,nbEp:10,ou:"Netflix"},
    {id:"d2",demo:true,titre:"Exemple : un film commencé",type:"film",statut:"en_cours",pos:72,duree:128,ou:"Canal+"},
    {id:"d4",demo:true,titre:"Exemple : série à jour, suite annoncée",type:"serie",statut:"termine",saison:2,nbSaisons:3,ep:8,nbEp:8,suite:"annoncee",suiteDate:"2027-03-12",note:5},
    {id:"d3",demo:true,titre:"Exemple : un film terminé",type:"film",statut:"termine",pos:110,duree:110,note:4}
  ];
  let items = [];
  let filtre = "tous", typeF = null, query = "";
  let editingId = null;

  const $ = s => document.querySelector(s);
  const listEl = $("#list");

  // ---------- stockage (sur le téléphone) ----------
  function load(){ try{ const r = localStorage.getItem(LS_KEY); const a = r ? JSON.parse(r) : []; return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(items)); }catch(e){ toast("Enregistrement impossible : stockage plein ou bloqué."); } }
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}

  function uid(){ return "t" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function save(item, quiet){
    item.maj = Date.now();
    const i = items.findIndex(x => x.id === item.id);
    if(i >= 0) items[i] = item; else items.push(item);
    persist(); if(!quiet) render();
  }
  function remove(id){ items = items.filter(x => x.id !== id); persist(); render(); }

  let toastT;
  function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3500); }

  // ---------- helpers ----------
  const clampInt = (v, min, fallback) => { const n = parseInt(v,10); return Number.isFinite(n) ? Math.max(min,n) : fallback; };
  const num = v => { const n = parseInt(v,10); return Number.isFinite(n) && n > 0 ? n : null; };
  const pad = n => String(n).padStart(2,"0");
  const hm = m => { m = Math.max(0, m|0); const h = Math.floor(m/60); return h ? h + "h" + pad(m%60) : m + " min"; };
  const LABEL = {a_voir:"À voir", en_cours:"En cours", termine:"Terminé"};
  function todayISO(){ const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function frDate(iso){ try{ return new Date(iso + "T00:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"numeric"}); }catch(e){ return iso; } }
  const stripHtml = s => String(s||"").replace(/<[^>]*>/g,"");

  function suiteState(it){
    const s = it.suite || "inconnu";
    if(s === "sortie") return "dispo";
    if(s === "annoncee" && it.suiteDate && it.suiteDate <= todayISO()) return "dispo";
    return s;
  }
  const attendSuite = it => it.type === "serie" && it.statut === "termine" && !["fin","annulee"].includes(suiteState(it));
  const suiteRank = it => ({dispo:0, annoncee:1, inconnu:2}[suiteState(it)] ?? 3);
  function statutLabel(it){
    if(it.type === "serie" && it.statut === "termine" && !["fin","annulee"].includes(suiteState(it))) return "À jour";
    return LABEL[it.statut];
  }
  function progress(it){
    if(it.statut === "termine") return 1;
    if(it.type === "film") return it.duree ? Math.min(1,(it.pos||0)/it.duree) : 0;
    const nbE = it.nbEp || 1;
    if(it.nbSaisons) return Math.min(1, ((it.saison-1) + (it.ep||0)/nbE) / it.nbSaisons);
    return Math.min(1,(it.ep||0)/nbE);
  }
  function epsForSeason(it){
    const n = Array.isArray(it.episodes) ? num(it.episodes[(it.saison||1)-1]) : null;
    if(n) it.nbEp = n;
  }

  // ---------- APIs publiques (sans compte) ----------
  async function getJSON(url, signal){
    const r = await fetch(url, {signal});
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  }
  async function searchSeries(q, signal){
    const res = await getJSON("https://api.tvmaze.com/search/shows?q=" + encodeURIComponent(q), signal);
    return (res || []).slice(0,5).map(({show}) => ({
      src:"tvmaze", tvmazeId: show.id, type:"serie", titre: show.name,
      annee: show.premiered ? num(show.premiered.slice(0,4)) : null,
      plateforme: (show.webChannel && show.webChannel.name) || (show.network && show.network.name) || "",
      poster: show.image ? (show.image.medium || show.image.original) : "",
      genre: (show.genres || [])[0] || "",
      statusShow: show.status
    }));
  }
  async function searchFilms(q, signal){
    const res = await getJSON("https://itunes.apple.com/search?media=movie&entity=movie&country=fr&lang=fr_fr&limit=5&term=" + encodeURIComponent(q), signal);
    return ((res && res.results) || []).map(m => ({
      src:"itunes", type:"film", titre: m.trackName,
      annee: m.releaseDate ? num(m.releaseDate.slice(0,4)) : null,
      duree: m.trackTimeMillis ? Math.round(m.trackTimeMillis/60000) : null,
      poster: m.artworkUrl100 ? m.artworkUrl100.replace("100x100","300x300") : "",
      genre: m.primaryGenreName || "", plateforme: ""
    }));
  }
  async function showDetails(id){
    const s = await getJSON("https://api.tvmaze.com/shows/" + id + "?embed=seasons");
    const seasons = ((s._embedded && s._embedded.seasons) || []).filter(x => x.number > 0).sort((a,b) => a.number-b.number);
    return {show: s, seasons};
  }

  // Met à jour saisons + saison suivante pour une série (source TVmaze)
  async function checkSerie(it){
    let id = it.tvmazeId;
    if(!id){
      const r = await searchSeries(it.titre);
      if(!r.length) return {it, changed:false};
      id = r[0].tvmazeId;
    }
    const {show, seasons} = await showDetails(id);
    const today = todayISO();
    const out = {...it, tvmazeId:id, suiteCheck: today};
    if(!out.poster && show.image) out.poster = show.image.medium || "";
    if(seasons.length){
      out.nbSaisons = Math.max(seasons.length, it.nbSaisons || 0);
      out.episodes = seasons.map(s => s.episodeOrder || null);
    }
    const before = suiteState(it);
    if(it.statut === "termine"){
      const next = (it.saison||1) + 1;
      const s = seasons.find(x => x.number === next);
      if(s && s.premiereDate && s.premiereDate <= today){ out.suite = "sortie"; out.suiteDate = s.premiereDate; }
      else if(s){ out.suite = "annoncee"; out.suiteDate = s.premiereDate || ""; }
      else if(show.status === "Ended"){ out.suite = "fin"; out.suiteDate = ""; }
      else if(!["fin","annulee"].includes(it.suite)){ out.suite = "inconnu"; out.suiteDate = ""; }
      out.suiteNote = show.status === "Running" ? "Série en cours de diffusion" : show.status === "Ended" ? "Série terminée" : show.status === "To Be Determined" ? "Avenir incertain" : "";
    }
    const after = suiteState(out);
    const news = it.statut === "termine" && after !== before && (after === "dispo" || after === "annoncee");
    return {it: out, changed:true, news};
  }

  let checking = false, lastCheckMsg = "";
  async function checkAll(force){
    if(checking || !navigator.onLine) return;
    const today = todayISO();
    const todo = items.filter(x => x.type === "serie" && !["fin","annulee"].includes(x.suite || "inconnu") && (force || x.suiteCheck !== today));
    if(!todo.length){ if(force){ lastCheckMsg = "Tout est déjà à jour."; render(); } return; }
    checking = true; render();
    const news = [];
    let fails = 0;
    for(const it of todo){
      try{
        const r = await checkSerie(it);
        const cur = items.find(x => x.id === it.id);
        if(r.changed && cur){ save({...cur, ...pick(r.it)}, true); if(r.news) news.push(r.it.titre); }
      }catch(e){ fails++; }
    }
    checking = false;
    lastCheckMsg = news.length ? "Nouveau : " + news.join(", ") : fails === todo.length ? "Vérification impossible (connexion ?). Réessaie plus tard." : "Vérifié aujourd'hui.";
    render();
    if(news.length) toast("Nouvelle saison : " + news.join(", "));

  // champs que la vérification a le droit de modifier
  function pick(o){ const k = ["tvmazeId","suiteCheck","poster","nbSaisons","episodes","suite","suiteDate","suiteNote"]; const r = {}; k.forEach(x => { if(x in o) r[x] = o[x]; }); return r; }

  // ---------- actions ----------
  function act(id, kind, arg){
    const src = items.find(x => x.id === id); if(!src) return;
    const it = {...src};
    if(kind === "ep+"){
      it.ep = Math.min((it.ep||0)+1, it.nbEp||99999);
      it.statut = "en_cours";
      if(it.ep >= it.nbEp && it.nbSaisons && it.saison >= it.nbSaisons) it.statut = "termine";
    } else if(kind === "ep-"){
      it.ep = Math.max(0,(it.ep||0)-1);
      if(it.statut === "termine") it.statut = "en_cours";
    } else if(kind === "saison+"){
      it.saison = (it.saison||1)+1; it.ep = 0; it.statut = "en_cours"; epsForSeason(it);
    } else if(kind === "nextSeason"){
      it.saison = (it.saison||1)+1;
      it.nbSaisons = it.nbSaisons ? Math.max(it.nbSaisons, it.saison) : null;
      it.ep = 0; it.statut = "en_cours"; it.suite = "inconnu"; it.suiteDate = ""; it.suiteNote = "";
      epsForSeason(it);
    } else if(kind === "suite"){
      it.suite = arg; if(arg !== "annoncee" && arg !== "sortie") it.suiteDate = "";
    } else if(kind === "suiteDate"){
      it.suiteDate = arg; if(arg && (it.suite||"inconnu") === "inconnu") it.suite = "annoncee";
    } else if(kind === "min+"){
      it.pos = Math.min((it.pos||0)+arg, it.duree||99999);
      it.statut = it.pos >= it.duree ? "termine" : "en_cours";
    } else if(kind === "fini"){
      it.statut = "termine";
      if(it.type === "film") it.pos = it.duree; else it.ep = it.nbEp;
      if(it.type === "serie"){ save(it); checkOne(it.id); return; }
    } else if(kind === "start"){
      it.statut = "en_cours";
    } else if(kind === "note"){
      it.note = it.note === arg ? 0 : arg;
    } else if(kind === "revoir"){
      it.statut = "en_cours";
      if(it.type === "film") it.pos = 0; else { it.saison = 1; it.ep = 0; epsForSeason(it); }
    }
    save(it);
    if(kind === "ep+" && it.statut === "termine" && it.type === "serie") checkOne(it.id);
  }
  async function checkOne(id){
    const it = items.find(x => x.id === id); if(!it || !navigator.onLine) return;
    try{ const r = await checkSerie(it); const cur = items.find(x => x.id === id); if(cur && r.changed) save({...cur, ...pick(r.it)}); }catch(e){}
  }

      else if(k.startsWith("on")){ if(v) e.addEventListener(k.slice(2), v); }
      else if(v !== false && v != null) e.setAttribute(k, v);

      }[st];
      suitePill = el("span",{class:"pill " + ({dispo:"s-dispo", annoncee:"s-annoncee", inconnu:"s-inconnu"}[st] || "s-fin")}, txt);
      const sel = el("select",{id:"s-" + it.id, "aria-label":"Saison suivante", disabled:dis, onchange: demo ? null : e => act(it.id,"suite",e.target.value)},
        [["inconnu","Pas d'info"],["annoncee","Annoncée"],["sortie","Disponible"],["fin","Pas de suite"],["annulee","Annulée"]]
          .map(([v,l]) => { const o = el("option",{value:v}, l); if((it.suite||"inconnu") === v) o.selected = true; return o; }));
      const dateIn = it.suite === "annoncee" ? el("input",{type:"date", id:"sd-" + it.id, "aria-label":"Date de sortie", value: it.suiteDate || "", disabled:dis, onchange: demo ? null : e => act(it.id,"suiteDate",e.target.value)}) : null;
      const info = (it.suiteNote || it.suiteCheck) ? el("div",{class:"auto"}, it.suiteNote ? el("span",{}, it.suiteNote) : null, it.suiteCheck ? el("span",{}, "Vérifié le " + frDate(it.suiteCheck)) : null) : null;
      suiteRow = el("div",{class:"suite"}, el("span",{}, "Saison " + next + " :"), sel, dateIn, info);
    }

    return el("article",{class:"card" + (demo ? " demo" : ""), "data-s": it.statut},
      el("div",{class:"c-head"},
        posterEl(it),
        el("div",{},
          el("h3",{class:"c-title"}, it.titre),
          el("div",{class:"meta"},
            demo ? el("span",{class:"pill p-demo"},"Exemple") : null,
            el("span",{class:"pill p-" + it.statut}, statutLabel(it)),
            suitePill,
            el("span",{class:"pill p-type"}, (it.type === "film" ? "Film" : "Série") + (it.annee ? " · " + it.annee : "")),

  }

  function checkBar(){

  function render(){

  // ---------- suggestions pendant la saisie ----------
  let suggTimer = null, suggCtl = null, picked = null, suggOff = false;

  function suggShow(nodes){ suggEl.textContent = ""; nodes.forEach(n => suggEl.append(n)); suggEl.hidden = nodes.length === 0; }
  function suggStatus(t){ suggShow(t ? [el("div",{class:"sugg-status"}, t)] : []); }
  function describe(s){
    const b = [s.type === "film" ? "Film" : "Série"];
    if(s.annee) b.push(String(s.annee));
    if(s.type === "film" && s.duree) b.push(hm(s.duree));
    if(s.plateforme) b.push(s.plateforme);
    if(s.genre) b.push(s.genre);
    return b.join(" · ");
  }
  async function fetchSuggestions(q){
    if(suggCtl) suggCtl.abort();
    const ctl = suggCtl = new AbortController();
    const wanted = $("#f-type").dataset.touched ? $("#f-type").value : null;
    suggStatus("Recherche…");
    const jobs = [];
    if(wanted !== "film") jobs.push(searchSeries(q, ctl.signal).catch(() => []));
    if(wanted !== "serie") jobs.push(searchFilms(q, ctl.signal).catch(() => []));
    const res = await Promise.all(jobs);
    if(ctl !== suggCtl || suggOff) return;
    // alterner séries / films, les plus pertinents d'abord
    const a = res[0] || [], b = res[1] || [], list = [];
    for(let i=0; i<5 && list.length<6; i++){ if(a[i]) list.push(a[i]); if(b[i]) list.push(b[i]); }
    if(!list.length){ suggStatus(navigator.onLine ? "Aucune suggestion. Remplis les infos à la main." : "Pas de connexion : remplis les infos à la main."); return; }
    suggShow(list.slice(0,6).map(s => el("button",{type:"button", onclick: () => applySuggestion(s)},
      s.poster ? el("img",{src:s.poster, alt:"", referrerpolicy:"no-referrer"}) : el("div",{class:"ph"}),
      el("div",{}, el("b",{}, s.titre), el("small",{}, describe(s))))));
  }
  async function applySuggestion(s){
    suggOff = true;
    picked = {annee: s.annee || null, genre: s.genre || "", poster: s.poster || "", tvmazeId: s.tvmazeId || null, episodes: null};
    $("#f-titre").value = String(s.titre).slice(0,120);
    $("#f-type").value = s.type; syncTypeFields();
    if(s.plateforme) $("#f-ou").value = String(s.plateforme).slice(0,40);
    if(s.type === "film"){
      if(s.duree) $("#f-duree").value = s.duree;
      suggStatus("Infos remplies : " + describe(s) + ". Vérifie puis enregistre.");
      return;
    }
    $("#f-saison").value = 1; $("#f-ep").value = 0;
    suggStatus("Récupération des saisons…");
    try{
      const {show, seasons} = await showDetails(s.tvmazeId);
      if(!suggOff) return;
      if(seasons.length){
        picked.episodes = seasons.map(x => x.episodeOrder || null);
        const today = todayISO();
        const sorties = seasons.filter(x => x.premiereDate && x.premiereDate <= today).length || seasons.length;

  // ---------- démarrage ----------
  items = load();
  render();
  setTimeout(() => checkAll(false), 800);
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") checkAll(false); });
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
